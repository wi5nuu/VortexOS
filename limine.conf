# Limine Bootloader Configuration for VortexOS
# Reference: https://github.com/limine-bootloader/limine
#
# This file is placed in the ISO root and read by Limine at boot time.

timeout: 0
serial: yes

# Graphics mode: let Limine pick the best available
# (We use serial for debug output in Phase 0)

/VortexOS
    protocol: limine
    kernel_path: boot:///vortexos.elf
